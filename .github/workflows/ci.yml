name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine acceptance tests (class figures)
        run: npm test
      - name: EN/中文 parity
        run: npm run check:i18n
      - name: Build single-file app
        run: npm run build
      - name: Committed build is up to date
        run: git diff --exit-code -- app/ || (echo "app/ is stale — run npm run build and commit" && exit 1)
      - name: No external URLs loaded at runtime
        run: node scripts/check-offline.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
