<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bond Credit Risk Case Lab — interactive companion to the UZH Executive Education class Credit Risk Management in Bond Investment. Fictional teaching case; educational use only.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Bond Credit Risk Case Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23BC0021'/%3E%3Cpath d='M6 22 L12 14 L18 18 L26 8' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Design tokens — the ONE file to edit to change the palette or fonts.
   Palette derived from the public website icbc.com.cn (no public brand manual);
   no logo or trademark is used. Red is the single accent, used with restraint.
   Contrast on white: #BC0021 6.9:1, #8A0018 10.4:1, #313030 12.9:1, #545454 7.5:1 (AA for text).
   #797979 (4.4:1) and #FA504B (3.1:1) are used only for borders, large text and highlights.
   ========================================================================== */
:root {
  --red: #BC0021;          /* primary: header/nav, primary actions */
  --red-light: #FA504B;    /* hover, highlights (never small text) */
  --red-dark: #8A0018;     /* pressed states, alarm text */
  --red-tint: #FBEAEC;     /* subtle highlight background */
  --text: #313030;         /* body text */
  --text-2: #545454;       /* secondary text */
  --text-3: #797979;       /* tertiary: large text, borders, decorations only */
  --border: #CCCCCC;
  --panel: #EEEEEE;
  --surface: #FFFFFF;
  --amber: #8A5A00;        /* alarm "watch" text (AA on white) */
  --amber-bg: #FFF4DB;
  --ok: #2F6B3A;           /* "within threshold" text (AA on white) */
  --ok-bg: #EAF4EC;
  --alarm-bg: #FBEAEC;

  /* Chart series (identity is always also given by direct labels / legends) */
  --series-rates: #545454;     /* benchmark rates — the control, not credit */
  --series-spread: #BC0021;    /* credit spread */
  --series-liquidity: #E8918C; /* liquidity / exit — hatched */
  --series-cost: #313030;      /* amortised cost / reference */
  --series-bid: #8A0018;       /* executable bid */
  --series-muted: #9A9A9A;

  --font-latin: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-zh: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  --font: var(--font-latin), var(--font-zh);
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;

  --radius: 4px;
  --gap: 16px;
  --fs-base: 15px;
  --panel-w: 280px;
}

html[data-presenter="true"] {
  --fs-base: 22px;
  --panel-w: 340px;
  --text: #1A1A1A;
  --text-2: #3A3A3A;
  --border: #9A9A9A;
}

/* Bond Credit Risk Case Lab — layout and components (light theme). */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs-base); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--panel); color: var(--text);
  font-family: var(--font); line-height: 1.5;
}
html[lang="zh-Hans"] body { font-family: var(--font-zh), var(--font-latin); line-height: 1.7; }
/* Chinese typography: strict line breaking, no mid-word breaks for Latin, punctuation kept in place */
:lang(zh) { line-break: strict; word-break: normal; overflow-wrap: anywhere; text-align: start; hanging-punctuation: allow-end; }
.num, table.data td.num, .metric-value, output, input[type="number"] { font-variant-numeric: tabular-nums lining-nums; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 .75em; }
a { color: var(--red); }
a:hover { color: var(--red-dark); }
:focus-visible { outline: 3px solid var(--red-light); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--surface); padding: 8px 12px; z-index: 100; }
.skip-link:focus { left: 8px; }

/* ---- Header ------------------------------------------------------------------------------- */
.topbar {
  background: var(--red); color: #fff; display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px 16px; padding: 10px 16px; position: sticky; top: 0; z-index: 20;
}
.topbar .brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 320px; }
.topbar .brand-title { font-size: 1.15rem; font-weight: 700; margin: 0; }
.topbar .brand-sub { font-size: .85rem; opacity: .95; }
.topbar .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.topbar .tools label, .topbar .tools .field-label { color: #fff; font-size: .8rem; white-space: nowrap; }
.topbar select, .topbar .btn-top {
  background: #fff; color: var(--text); border: 1px solid #fff; border-radius: var(--radius);
  padding: 4px 8px; font: inherit; font-size: .85rem; min-height: 32px;
}
.topbar .btn-top[aria-pressed="true"] { background: var(--red-dark); color: #fff; border-color: #fff; }
.topbar .field { margin: 0; flex-direction: row; align-items: center; gap: 6px; }
.topbar .segmented { background: rgba(255,255,255,.15); }
.topbar .seg-item label { color: #fff; }
.topbar .seg-item input:checked + label { background: #fff; color: var(--red-dark); }
.timer { background: var(--red-dark); color: #fff; padding: 4px 10px; border-radius: var(--radius); font-size: .85rem; }
.timer strong { font-variant-numeric: tabular-nums; }

/* ---- Layout -------------------------------------------------------------------------------- */
.layout { display: grid; grid-template-columns: var(--panel-w) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
.panel { background: var(--surface); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
.panel h2 { font-size: 1rem; color: var(--text-2); text-transform: none; margin-top: 1em; }
.panel .stop-nav { display: grid; gap: 6px; }
.main { padding: 16px 20px 0; min-width: 0; display: flex; flex-direction: column; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
  .panel { border-right: 0; border-bottom: 1px solid var(--border); }
  .panel-inner { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
}

/* ---- Tiles --------------------------------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (min-width: 1600px) { .tiles { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
@media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metric { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border); border-radius: var(--radius); padding: 8px 10px; }
.metric-label { font-size: .78rem; color: var(--text-2); }
.metric-value { font-size: 1.25rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-sub { font-size: .75rem; color: var(--text-2); }
.metric.tone-red { border-top-color: var(--red); }
.metric.tone-red .metric-value { color: var(--red-dark); }
.metric.tone-amber { border-top-color: #C98A00; }
.metric.tone-ok { border-top-color: var(--ok); }

/* ---- Tabs ---------------------------------------------------------------------------------- */
.tablist { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--red); margin-bottom: 0; }
.tab {
  background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0;
  padding: 6px 10px; font: inherit; font-size: .85rem; color: var(--text); cursor: pointer; min-height: 36px;
}
.tab:hover { border-color: var(--red-light); }
.tab[aria-selected="true"] { background: var(--red); color: #fff; border-color: var(--red); font-weight: 700; }
.tab .tab-n { color: var(--text-2); margin-right: 4px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .tab-n { color: #fff; }
.tab.visited:not([aria-selected="true"])::after { content: "✓"; color: var(--ok); margin-left: 4px; font-size: .8em; }
.tabpanel { background: var(--surface); border: 1px solid var(--border); border-top: 0; padding: 16px 20px 24px; flex: 1; }
.tab-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.tab-intro { color: var(--text-2); max-width: 80ch; }

/* ---- Back to the question ----------------------------------------------------------------- */
.back-strip {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; background: var(--red-tint);
  border-left: 4px solid var(--red); padding: 8px 12px; margin: 0 0 16px; border-radius: 0 var(--radius) var(--radius) 0;
}
.back-label { font-weight: 700; color: var(--red-dark); white-space: nowrap; }

/* ---- Grid & cards -------------------------------------------------------------------------- */
.grid { display: grid; gap: var(--gap); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.grid-fields { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 100px), 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.grid-side { grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); }
@media (max-width: 800px) { .grid-side { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card-title { font-size: 1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.card.accent { border-left: 4px solid var(--red); }
.muted { color: var(--text-2); }
.small { font-size: .85rem; }
.note { font-size: .85rem; color: var(--text-2); border-left: 3px solid var(--border); padding-left: 8px; }
.label-illustrative { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--red-dark); border: 1px solid var(--red-dark); border-radius: 3px; padding: 1px 6px; }
.badge { display: inline-block; font-size: .75rem; font-weight: 700; border-radius: 3px; padding: 2px 8px; }
.badge-fictional { background: #fff; color: var(--red-dark); border: 1px solid #fff; }
.main .badge-fictional { border-color: var(--red-dark); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .78rem; font-weight: 700; border: 1px solid currentColor; }
.pill.red { color: var(--red-dark); background: var(--alarm-bg); }
.pill.amber { color: var(--amber); background: var(--amber-bg); }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.neutral { color: var(--text-2); background: var(--panel); }
.stack > * + * { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* ---- Forms --------------------------------------------------------------------------------- */
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label, .field-label { font-size: .85rem; color: var(--text); font-weight: 600; }
.field-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.slider-value { font-weight: 700; color: var(--red-dark); white-space: nowrap; }
.field-hint { font-size: .78rem; color: var(--text-2); }
input[type="range"] { width: 100%; accent-color: var(--red); min-height: 28px; }
input[type="number"], input[type="text"], input[type="date"], textarea, select {
  font: inherit; font-size: .95rem; padding: 6px 8px; border: 1px solid var(--text-3); border-radius: var(--radius);
  background: #fff; color: var(--text); min-height: 36px; width: 100%;
}
input:disabled, select:disabled, textarea:disabled { background: var(--panel); color: var(--text-2); }
.input-suffix { display: flex; align-items: center; gap: 6px; }
.suffix { color: var(--text-2); font-size: .85rem; white-space: nowrap; }
.field-check { flex-direction: row; align-items: center; gap: 8px; }
.field-check input { width: 20px; height: 20px; accent-color: var(--red); }
.field-check label { font-weight: 400; }
.req { color: var(--red-dark); }
.segmented { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg-item { position: relative; }
.seg-item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-item label { display: block; padding: 5px 10px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--text); min-height: 32px; }
.seg-item input:checked + label { background: var(--red); color: #fff; }
.seg-item input:focus-visible + label { outline: 3px solid var(--red-light); outline-offset: -3px; }
.seg-item input:disabled + label { cursor: not-allowed; opacity: .7; }

.btn {
  font: inherit; font-size: .9rem; font-weight: 600; border-radius: var(--radius); padding: 6px 12px; min-height: 36px;
  border: 1px solid var(--red); background: #fff; color: var(--red); cursor: pointer;
}
.btn:hover { border-color: var(--red-light); background: var(--red-tint); }
.btn:active { background: var(--red-dark); color: #fff; }
.btn-primary { background: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); color: #fff; }
.btn-reveal { border-style: dashed; }
.btn-link { border: 0; background: none; color: var(--red); padding: 2px 0; min-height: 0; text-decoration: underline; }
.btn-small { padding: 2px 8px; min-height: 28px; font-size: .8rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---- Tables -------------------------------------------------------------------------------- */
.table-wrap { overflow-x: auto; max-width: 100%; }
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.data caption { text-align: left; font-weight: 700; padding: 4px 0; }
table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
table.data thead th { background: var(--panel); font-size: .8rem; color: var(--text); }
table.data td.num, table.data th.num { text-align: right; }
table.data tr.total th, table.data tr.total td { font-weight: 700; border-top: 2px solid var(--text); }
table.data tr.hl th, table.data tr.hl td { background: var(--red-tint); }
td.cell-red { color: var(--red-dark); font-weight: 700; background: var(--alarm-bg); }
td.cell-amber { color: var(--amber); font-weight: 700; background: var(--amber-bg); }
td.cell-ok { color: var(--ok); }
.check-ok { color: var(--ok); font-weight: 700; }
.check-bad { color: var(--red-dark); font-weight: 700; }

/* ---- Workings / reveal / hints ------------------------------------------------------------ */
.workings { margin-top: 8px; font-size: .85rem; }
.workings summary { cursor: pointer; color: var(--red); font-weight: 600; }
.workings-body { background: var(--panel); border-radius: var(--radius); padding: 8px 10px; margin-top: 6px; }
.formula { font-family: var(--mono); white-space: pre-wrap; margin: 0 0 6px; font-size: .85rem; }
.workings-inputs th { text-align: left; font-weight: 400; padding-right: 12px; color: var(--text-2); }
.workings-inputs td { text-align: right; }
.workings-note { margin: 6px 0 0; color: var(--text-2); }
.revealed { border-left: 4px solid var(--ok); background: var(--ok-bg); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; }
.revealed.wrong { border-left-color: var(--red); background: var(--alarm-bg); }
.reveal-slot { margin: 8px 0; }
.hint { margin: 6px 0; }
.hint-text { background: var(--amber-bg); padding: 6px 10px; border-radius: var(--radius); font-size: .9rem; }

/* ---- Poll / votes ------------------------------------------------------------------------- */
.poll-list { display: grid; gap: 8px; }
.poll-item { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: start; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; background: #fff; }
.poll-letter { font-weight: 700; font-size: 1.2rem; color: var(--red); }
.tally { display: inline-flex; align-items: center; gap: 4px; }
.tally input { width: 4.5em; min-height: 32px; }
.vote-bar { height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.vote-bar > span { display: block; height: 100%; background: var(--red); }

/* ---- Timeline ----------------------------------------------------------------------------- */
.timeline { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--border); }
.timeline li { position: relative; padding: 0 0 14px 18px; }
.timeline li::before { content: ""; position: absolute; left: -8px; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid var(--red); }
.timeline .t-date { font-weight: 700; color: var(--red-dark); }
.timeline .t-kind { font-size: .75rem; color: var(--text-2); margin-left: 6px; }

/* ---- Charts ------------------------------------------------------------------------------- */
.chart { width: 100%; height: auto; display: block; font-family: var(--font); }
.chart .grid { stroke: #E3E3E3; stroke-width: 1; }
.chart .axis { stroke: var(--text-3); stroke-width: 1; }
.chart .tick, .chart .axis-label { fill: var(--text-2); font-size: 11px; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.chart .end-label, .chart .bar-label { fill: var(--text); font-size: 13px; }
.chart .bar-value { fill: var(--text); font-size: 13px; font-weight: 700; }
.chart .marker { fill: var(--red); stroke: #fff; stroke-width: 2; }
.chart .marker-label { fill: var(--text); font-size: 11px; font-weight: 700; }
.chart .vline { stroke: var(--red-dark); stroke-dasharray: 4 3; stroke-width: 1.5; }
.chart .vline-label { fill: var(--red-dark); font-size: 11px; font-weight: 700; }
.chart .crosshair { stroke: var(--text-3); stroke-width: 1; }
.chart .tip-bg { fill: #fff; stroke: var(--border); }
.chart .tip { fill: var(--text); font-size: 12px; }
.chart .hatch-bg { fill: var(--series-liquidity); }
.chart .hatch-line { stroke: var(--red-dark); stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; margin: 4px 0 8px; padding: 0; list-style: none; }
.legend li { display: inline-flex; gap: 6px; align-items: center; }
.swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.swatch.line { height: 3px; border-radius: 0; }
.swatch.hatch { background: repeating-linear-gradient(45deg, var(--series-liquidity) 0 3px, var(--red-dark) 3px 4px); }

/* ---- Footer ------------------------------------------------------------------------------- */
.footer { font-size: .78rem; color: var(--text-2); padding: 12px 0 20px; }
.footer p { margin: 0 0 4px; max-width: 120ch; }

/* ---- Misc components ---------------------------------------------------------------------- */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; font-weight: 600; }
.statements { counter-reset: st; list-style: none; padding: 0; }
.statements li { counter-increment: st; border: 1px solid var(--border); border-left: 4px solid var(--red); border-radius: var(--radius); padding: 10px 12px 10px 44px; margin-bottom: 8px; position: relative; background: #fff; }
.statements li::before { content: counter(st); position: absolute; left: 12px; top: 8px; font-weight: 700; font-size: 1.3rem; color: var(--red); }
.question-hero { font-size: 1.6rem; font-weight: 700; color: var(--text); border-left: 6px solid var(--red); padding: 8px 16px; margin: 8px 0 16px; background: #fff; }
.progress { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--red); }
.glossary-list { display: grid; gap: 6px; }
.gloss-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr); gap: 12px; border-bottom: 1px solid var(--border); padding: 6px 0; }
@media (max-width: 800px) { .gloss-item { grid-template-columns: 1fr; gap: 2px; } }
.mech-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.mech { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: #fff; }
.mech[data-on="true"] { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
.impact-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.impact { font-size: .75rem; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--text-2); }
.impact.on { background: var(--red); border-color: var(--red); color: #fff; }
.ladder-marker { color: var(--red-dark); font-weight: 700; }
.validation { list-style: none; padding: 0; margin: 8px 0; }
.validation li::before { content: "✗ "; color: var(--red-dark); font-weight: 700; }
.validation li.ok::before { content: "✓ "; color: var(--ok); }
.trigger-row { display: grid; grid-template-columns: 170px 90px 120px 170px minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 8px; border-bottom: 1px dashed var(--border); }
.trigger-row .field { margin-bottom: 8px; }
.trigger-row > .btn { margin-bottom: 8px; }
@media (max-width: 1100px) { .trigger-row { grid-template-columns: 1fr 1fr 1fr; } }
.prob-bar { margin: 8px 0 16px; }
.print-only { display: none; }

/* ---- Presenter mode ------------------------------------------------------------------------ */
html[data-presenter="true"] .tab { font-size: .75rem; padding: 6px 8px; }
html[data-presenter="true"] .metric-value { font-size: 1.5rem; }
html[data-presenter="true"] .chart .tick, html[data-presenter="true"] .chart .axis-label { font-size: 14px; }
html[data-presenter="true"] .chart .end-label, html[data-presenter="true"] .chart .bar-label,
html[data-presenter="true"] .chart .bar-value, html[data-presenter="true"] .chart .marker-label { font-size: 15px; }
html[data-presenter="true"] .panel { font-size: .8rem; }
html[data-presenter="true"] .tabpanel { border-width: 2px; }
html[data-presenter="true"] .footer { font-size: .6rem; }
html[data-presenter="true"] .field-hint, html[data-presenter="true"] .note { font-size: .8rem; }
.instructor-only { display: none; }
html[data-mode="instructor"] .instructor-only { display: revert; }
.shortcut-help { font-size: .78rem; color: var(--text-2); }

ut RMB 0.83 m instantly — identical for any 3-year CGB of the same duration.","where":{"AC":"Economic value only; not in P&L or OCI unless sold (interest-rate risk in the banking book is managed separately).","FVOCI":"Fair-value change goes to OCI and therefore CET1; recycled to P&L on sale.","FVTPL":"Straight through P&L."}},"spread":{"name":"Spread widening","desc":"The market demands more compensation for this issuer or sector. Price falls with spread duration × Δspread.","case":"Huaxing: 210 → 450 bp by Mar 2026 costs RMB 4.36 m of price while the coupon is paid.","where":{"AC":"Economic value only; the carrying amount does not move until impairment or sale.","FVOCI":"OCI (and CET1); the credit part is also reflected through ECL in P&L.","FVTPL":"Straight through P&L."}},"liquidity":{"name":"Liquidity / exit discount","desc":"Bid–ask widens as credit deteriorates. The executable price is below mid; the gap is paid only when you sell.","case":"Huaxing: bid–ask 5 → 100 bp; in Jun 2026 selling costs RMB 1.44 m more than the mid value.","where":{"AC":"Realised on sale only.","FVOCI":"Realised on sale; fair value may already sit at an exit price inside the bid–ask.","FVTPL":"Realised on sale; fair value may already sit at an exit price inside the bid–ask."}},"ecl":{"name":"Higher expected credit loss","desc":"IFRS 9 / CAS 22 recognise expected losses. A significant increase in credit risk moves the bond to Stage 2 and lifetime ECL.","case":"Huaxing: allowance 0.60 → 6.00; a 5.40 charge in April 2026 with every coupon paid.","where":{"AC":"P&L (allowance reduces the carrying amount).","FVOCI":"P&L; the allowance is recognised in OCI, not against the carrying amount.","FVTPL":"Outside the impairment scope — already inside the fair-value change."}},"refinancing":{"name":"Refinancing, support or recovery change","desc":"Maturity walls, lost market access, weaker shareholder support or a lower expected recovery change PD and LGD before any default.","case":"Huaxing: RMB 1 ing cost at {f}","funded":"Funded return","liquidityIfSold":"Memo: exit discount if sold now","cleanNote":"Clean basis: coupons + accrued + clean price change = gross total return.","dirtyNote":"Dirty basis: the value change already includes accrued interest.","hpFormula":"Gross = coupons received + accrued + (clean now − purchase price)\nFunded = gross − purchase price × funding rate × elapsed years","purchasePrice":"Purchase price","cleanNow":"Clean price now","dirtyNow":"Dirty value now","fundingRate":"Funding rate","elapsed":"Elapsed","exTitle":"Exercise — three shocks: vote first, then reveal","exQ":"At purchase (T0), which of these instantaneous shocks costs most on RMB 100 m — and which one is not credit at all?","shock":{"spread120":"Huaxing spread +120 bp","spread50":"Huaxing spread +50 bp","bench30":"Benchmark CGB yield +30 bp"},"exTally":"Enter the show of hands for “costs most”.","voteFor":"Votes for {x}","myVote":"My vote: costs most","voteFirst":"Vote first — the reveal unlocks after a vote is recorded.","shockCol":"Shock","creditQ":"Credit?","exAnswer":"The +120 bp spread shock costs most. The +30 bp benchmark shock is not credit: an identical-duration government bond loses the same. Note how the duration approximation overstates each DCF loss.","exFormula":"ΔV ≈ −MV × D_mod × Δy  vs  ΔV = PV(y₀ + Δy) − PV(y₀)"},"spread":{"inputs":"Inputs","spread":"Spread","pdPhys":"Physical (real-world) annual PD","lgd":"LGD","liq":"Liquidity premium","hint":"Hold the spread at 210 bp and raise the PD until the credit-risk premium disappears. Where is that point relative to the break-even PD?","anatomyTitle":"What the spread pays for","el":"Expected loss (PD × LGD)","crp":"Credit-risk premium","lp":"Liquidity premium","component":"Component","bpCol":"bp p.a.","total":"Spread","negative":"The components exceed the spread: at these inputs the bond does not even cover expected loss and liquidity.","anatFormula":"Spread = EL + credit-risk premium + liquidity premium\nEL = PD_physical × LGD; credit-risk premium = residual","beTitle":"Simplified break-even PD","beRead":"A spread of {spread} with LGD {lgd} breaks even at an annual default rate of about {pd}.","rnRead":"Risk-neutral PD (spread net of liquidity ÷ LGD) ≈ {rn}, against a physical PD of {phys}.","beCaveat":"Spread ÷ LGD is a simplified break-even, not a PD estimate: it ignores the liquidity premium, the risk premium, funding and the timing of default.","beFormula":"Break-even PD ≈ spread ÷ LGD\nRisk-neutral PD ≈ (spread − liquidity premium) ÷ LGD","pvsqTitle":"Physical vs risk-neutral PD","pvsq":["A physical (real-world) PD is what an analyst estimates will happen; it drives ECL.","A risk-neutral PD is the default rate implied by prices; it includes compensation for bearing risk and is therefore higher."],"pvsqQ":"Which one belongs in an IFRS 9 ECL, and which one in a price?","pvsqA":["ECL uses an unbiased, probability-weighted estimate — physical PD, with forward-looking scenarios.","Prices embed risk-neutral PD. Using a market-implied PD in ECL overstates expected loss; ignoring market signals in SICR understates risk."],"sizingTitle":"Sizing: one default vs a year of spread income","weight":"Position weight in the portfolio","restSpread":"Spread on the rest of the portfolio","measure":"Measure","ofPortfolio":"% of portfolio","lossIfDefault":"Loss if this position defaults","restIncome":"One year of spread income on the rest at {s}","years":"Years of spread income to recover","sizingRead":"A 1% position with LGD 60% costs 0.60% of the portfolio — more than a year of income at 40 bp (0.396%), less than half a year at 150 bp (1.485%).","sizingFormula":"Loss = weight × LGD\nIncome on the rest = (1 − weight) × spread\nYears = loss ÷ income"},"ratings":{"scalesTitle":"National scale vs global scale","scales":["A national-scale rating ranks issuers relative to each other within one country; a global-scale rating compares default risk across countries.","Both are opinions with tion gap"},"grades":{"g3":"Internal grade 3 — sound","g4":"Internal grade 4 — acceptable","g5":"Internal grade 5 — acceptable, monitor","g6":"Internal grade 6 — watch","g7":"Internal grade 7 — weak","g8":"Internal grade 8 — very weak"},"qTitle":"Discussion","q":"The rating agency did not downgrade. Why can the termination still be negative information?","a":["Termination at the issuer’s request removes an independent monitor at exactly the time monitoring matters; issuers rarely drop ratings they expect to be upgraded.","It is evidence to assess — with the sales, CFO, trust-loan and FY2025 facts — not a mechanical downgrade and not a reason to ignore the other evidence."]},"timeline":{"factsTitle":"Dated facts","thesis":"Thesis still stands?","stillStands":"{pct}% say the thesis still stands","revealNext":"Reveal next fact ({date})","allRevealed":"All facts revealed. Every coupon has been paid.","progress":"{n} of {total} facts revealed","marketLine":"Market: spread {spread}, bid–ask {ba}","kinds":{"market":"market","operating":"operating","governance":"governance","payment":"payment","funding":"funding","financials":"financials","rating":"rating","maturities":"maturities"},"facts":{"f0":"Market repricing with no issuer news: benchmark +30 bp to 1.80%; developer spreads widen, Huaxing 210 → 330 bp; bid–ask in yield 5 → 40 bp.","f1":"Monthly contracted sales −31% y/y (sector −12%).","f2":"The CFO resigns.","f3":"Annual coupon of 3.60 paid in full and on time. Spread 450 bp; yield 6.30%; price 95.07.","f4":"Two project-company trust loans are extended — at project level, not the issuer’s bonds.","f5":"FY2025 results: revenue RMB 215 bn (−24%), total debt 310, debt/EBITDA 7.8×, EBITDA/interest 1.6×, unrestricted cash 42 vs short-term debt 98 (0.43×), operating cash flow −9 vs net profit +4.","f6":"National-scale rating terminated at the issuer’s request.","f7":"Maturity wall: RMB 12 bn onshore bond due September 2026; US$ 800 m keepwell notes of an offshore SPV (a different obligor) due December 2026."},"readings":{"f0":"Market-wide: the control (rates) and sector spread move together; no issuer-specific evidence yet.","f1":"Sales fall far faster than the sector: issuer-specific cash generation is weakening.","f2":"Governance and information risk: who signs the next financial statements?","f3":"The coupon is paid — and the position is still down: price −4.93, funded return −3.33.","f4":"Project-level extensions are not a default on your bond, but they show refinancing pressure inside the group.","f5":"Cash cover below 1× and negative operating cash flow with a positive profit: earnings are not turning into cash.","f6":"Information to assess, not a rating action. See the Ratings tab.","f7":"Refinancing risk is now dated. The keepwell notes are owed by the SPV, not by the parent."},"ratiosTitle":"Ratios before and after","fy2025":"FY2025","alarmNote":"Alarm colouring (illustrative thresholds): red — debt/EBITDA ≥ 6.5×, EBITDA/interest \u003c 2×, cash cover \u003c 1×, operating cash flow negative; amber — watch zone.","missingTitle":"Missing-information checklist","missingIntro":"Tick what you would need before deciding. Missing information is itself evidence.","missingCount":"{n} of {total} items flagged as missing","missing":{"projectDebt":"Project-level debt and guarantees given by the parent","restrictedCash":"Split of restricted vs unrestricted cash and escrowed pre-sale proceeds","maturityProfile":"Month-by-month maturity schedule, onshore and offshore","jvDebt":"Off-balance-sheet joint-venture debt","salesCollection":"Cash collection rate on contracted sales","landBank":"Encumbrance and valuation of the land bank","trustTerms":"Terms of the extended trust loans (rate, security, cross-default)","supportDocs":"Any documentation of shareholder support","crossDefault":"Cross-default and cross-acceleration clauses between onshore and offshore debt","auditOpinion":"Auditor’s opinion and any going-concern emphasis"},"supportTitle":" eriod expires.","a":"A payment default on the bond."},"q5":{"q":"The offshore SPV misses a payment and the parent does not provide funds under the keepwell deed.","a":"An SPV payment default on the notes; against the parent it is a possible breach of the deed, whose enforceability and damages depend on wording, law and facts."}},"precTitle":"Precedent notes","prec":{"founder":{"title":"Founder keepwell litigation (Hong Kong)","text":["The Hong Kong court treated the keepwell deeds as enforceable and found the keepwell provider in breach.","On those facts, damages for the issuer/guarantor claimants were nominal: an enforceable deed did not deliver the economics of a guarantee."]},"baoshang":{"title":"Baoshang Bank, 2020","text":["Tier-2 capital bonds were written down in full at the point of non-viability in 2020 — the first such write-down of a bank capital instrument in China."]},"noncall":{"title":"A 2026 Tier-2 non-call","text":["In 2026 a Chinese bank Tier-2 bond was not called at its first call date; the coupon continued. Holders faced extension, not default — and marked-to-market losses."]}},"precNote":"Summaries for teaching; verify the judgments and announcements in primary sources before relying on them."},"ccy":{"CNY":"CNY","USD":"USD"},"bench":{"cgb":"China Government Bond curve","ust":"US Treasury curve"},"portfolio":{"questionsIntro":"For every line answer four questions:","ccyBench":"Currency: {ccy} · benchmark: {bench}","q":{"mechanism":"Which mechanism can cause a loss while it keeps paying?","mechanismShort":"Mechanism","missing":"What information is missing?","missingShort":"Missing information","control":"Which control or limit addresses it?","controlShort":"Control","evidence":"What evidence would change the decision?","evidenceShort":"Evidence that changes the decision"},"notes":"Your notes","notesPh":"Missing information, evidence…","modelAnswer":"Reveal model answer","checkModel":"Check against the model answer","controls":{"durationLimit":"Du ort documentation.","control":"SICR review and a dated escalation rule.","evidence":"Counterfactual A (registered guarantee + loan) or B (extension proposal)."},"keepwell":{"name":"USD keepwell note vs UST","desc":"Offshore SPV note; spread against US Treasuries, in USD.","mechanism":"Structure (keepwell is not a guarantee), refinancing, USD spread moves.","missing":"Deed enforceability, cross-border approvals, onshore assets reachable.","control":"Legal structure review; FX hedge and cross-currency limits.","evidence":"Parent performing under the deed, or a court decision on enforcement."}},"refTitle":"Nine-line reference list","refCols":{"line":"Line","ccy":"Currency","bench":"Benchmark","mech":"Dominant mechanism while paying","control":"Key control"},"ref":{"r1":{"name":"China Government Bond 10y","mech":"Benchmark rates (control)","control":"Duration limit"},"r2":{"name":"Policy-bank bond 5y","mech":"Rates; small spread to CGB","control":"Duration limit"},"r3":{"name":"Provincial government special bond","mech":"Rates; liquidity","control":"Duration and liquidity limits"},"r4":{"name":"Big-six bank Tier-2 10NC5","mech":"Spread; non-call extension; write-down","control":"Call monitoring, legal review"},"r5":{"name":"Joint-stock bank perpetual (AT1)","mech":"Coupon cancellation; non-call; write-down","control":"Legal review, concentration"},"r6":{"name":"Central SOE MTN","mech":"Spread; support assumptions","control":"Support assessment"},"r7":{"name":"District LGFV MTN","mech":"Refinancing; support; liquidity","control":"Regional concentration limit"},"r8":{"name":"USD keepwell note (offshore SPV)","mech":"Structure; refinancing; USD spread","control":"Legal review; FX hedge"},"r9":{"name":"US Treasury 5y","mech":"USD rates (control); FX","control":"Duration and FX limits"}},"ccyNote":"Spreads are measured against the benchmark of each line’s own currency. Never compare a USD spread over US Treasuries with a CNY spread over CGBs."},"recog":{"scenTitle":"ECL scenario inputs","scenIntro":"Up to three scenarios, probability-weighted (weights are normalised). Class default: one scenario, 12-month PD 6%, lifetime PD 10%, LGD 60%.","scen0":"Scenario 1 (base)","scen1":"Scenario 2 (upside)","scen2":"Scenario 3 (downside)","weight":"Weight","lgd":"LGD","pd12":"12-month PD","pdLife":"Lifetime PD","discount":"Lifetime ECL","undiscounted":"Undiscounted","discounted":"Discounted 1 year at EIR","sicrTitle":"SICR judgement and evidence","sicrIntro":"Has credit risk increased significantly since initial recognition? Tick the evidence available in April 2026.","evidence":{"spread":"Spread 210 → 550 bp since purchase","rating":"Rating withdrawn / internal grade downgraded","financials":"FY2025: cash cover 0.43×, negative operating cash flow","watchlist":"On the internal watchlist","dpd30":"More than 30 days past due (rebuttable presumption)"},"evidenceCount":"{n} of 5 evidence items ticked. The stage is a judgement: the 30-days-past-due presumption is a backstop, not the test.","presumption":"More than 30 days past due: SICR is presumed (rebuttable).","stageJudgement":"Stage judgement","stage1":"Stage 1 (12-month ECL)","stage2":"Stage 2 (lifetime ECL)","hint":"Compare the charge under Stage 1 and Stage 2. The difference is the cost of the SICR judgement.","poci":"POCI note: a bond bought already credit-impaired (e.g. a newly purchased distressed Huaxing bond) is “purchased or originated credit-impaired”: no Day-1 allowance, a credit-adjusted EIR, and later changes in lifetime ECL go through P&L.","eclTitle":"ECL (RMB m)","measure":"Measure","amount":"Amount","ecl12":"12-month ECL","eclLife":"Lifetime ECL","prevAllowance":"Allowance before (12-month at T0)","allowance":"Required allowance (Stage {n})","allowanceShort":"Required allowance","charge":"Charge to P&L","altCharge":"Charge if Stage {n} instead","eclFormula":"ECL = Σ wₛ × PDₛ × LGDₛ × EAD\nLifetime (discounted) = PD_life × LGD × EAD ÷ (1 + EIR)\nCharge = required allowance − allowance before","ead":"EAD (nominal)","eir":"EIR","lensTitle":"The same position through three lenses (15 Apr 2026, RMB m)","line":"Line","lensCaption":"Gross amortised cost {gross} (dirty, incl. accrued) · fair value {fv} (mid) · lens selected: {lens}","carrying":"Carrying amount","pnl":"P&L (period)","oci":"OCI (cumulative)","equity":"Equity effect (cumulative)","eclWhere":"Where ECL appears","eclAC":"P&L; reduces carrying amount","eclFVOCI":"P&L; allowance in OCI","eclFVTPL":"Outside impairment scope","lensRead":"Same bond, same date, three different pictures: AC shows only the ECL charge; FVOCI adds the non-credit fair-value change in OCI; FVTPL shows the whole economic change in P&L.","lensFormula":"AC carrying = gross amortised cost − allowance\nFVOCI carrying = fair value; OCI = fair value − gross amortised cost + allowance\nFVTPL P&L = fair value − gross amortised cost","lensNote":"Interest income at the EIR is excluded to isolate the credit and fair-value effects (teaching simplification).","gross":"Gross amortised cost","fv":"Fair value (mid)","classTitle":"Classification: business model + SPPI","classText":["Under IFRS 9 / CAS 22 the measurement lens is set at purchase by the business model and the SPPI (solely payments of principal and interest) test — not by later performance.","ECL applies to amortised cost and FVOCI; FVTPL assets are outside the impairment scope."],"bm":"Business model","sppi":"SPPI test","result":"Measurement","bmHold":"Hold to collect","bmBoth":"Hold to collect and sell","bmOther":"Other (trading, fair-value managed)","bmAny":"Any","sppiPass":"Passed","sppiAny":"Passed or failed","sppiFail":"Failed","fc":{"title":"China five-category classification vs IFRS 9 stage","intro":["Scope: the 2023 Measures for the Risk Classification of Financial Assets cover financial assets bearing credit risk, including bonds held in the banking book; trading-book assets are excluded.","The two systems answer different questions: the IFRS stage measures change in credit risk since purchase; the five categories measure the current risk of the asset."],"dpd":"Days past due","days":"{n} days","eclRatio":"ECL / gross carrying amount","npShare":"Share of this debtor’s exposures at the bank already non-performing","impaired":"Credit-impaired","restructured":"Restructured (debtor in financial difficulty)","adverse":"Other factors that may affect repayment (watchlist)","useCase":"Use the ECL ratio of the case","category":"Five-category result","stage":"IFRS 9 stage","npl":"Non-performing","performing":"Performing","cats":{"normal":"Normal","specialMention":"Special mention","substandard":"Substandard","doubtful":"Doubtful","loss":"Loss"},"stageReason":{"impaired":"credit-impaired","dpd90":"more than 90 days past due","sicr":"significant increase in credit risk (judgement)","dpd30":"more than 30 days past due (presumption)","none":"no significant increase"},"rulesFired":"Rules applied:","noRule":"none — normal","rules":{"dpdAny":"any amount past due → at least special mention","adverse":"adverse factors → at least special mention","restructured":"restructured asset → at least special mention, with an observation period before any upgrade","dpd90":"more than 90 days past due → at least substandard","impaired":"credit-impaired → at least substandard","debtor10":"≥ 10% of the debtor’s exposures non-performing → all its exposures at least substandard","dpd270":"more than 270 days past due → at least doubtful","ecl50":"credit-impaired and ECL ≥ 50% → at least doubtful","dpd360":"more than 360 days past due → loss","ecl90":"ECL ≥ 90% → loss"},"whyDiffer":"Why they differ here: the bond is in Stage 2 because risk rose sharply since purchase, but it is current and not credit-impaired — the five categories can still read “normal” unless adverse factors are recorded.","whyGeneral":"Credit-impaired assets are Stage 3 and at least substandard; Stage 2 has no automatic five-category equivalent.","formula":"Category = the most severe floor among the rules triggered (teaching summary of the 2023 Measures)","source":"Teaching summary; check the text of the 2023 Measures and internal policy before use.","group":"Group members are assessed individually: problems at Huaxing’s project companies or its offshore SPV are evidence for the parent, not an automatic downgrade of the parent’s exposures."},"qTitle":"Discussion","q":"Which lens shows the April 2026 loss most completely — and which one hides it until sale?","a":["FVTPL shows the whole economic change (−6.41) in P&L. FVOCI shows the same equity effect split between P&L (ECL) and OCI.","Amortised cost shows only the ECL charge (−5.40); the spread and liquidity loss stay hidden until the bond is sold."]},"capital":{"rwTitle":"Standardised risk weights (weighted approach)","exposure":"Exposure","rw":"Risk weight","ref":"Reference (to verify)","rwRows":{"cgb":"China central government bonds","pbc":"People’s Bank of China","policyBank":"Policy banks","localGeneral":"Local government general bonds","localSpecial":"Local government special bonds","bankA":"Domestic commercial bank, grade A (general)","bankB":"Domestic commercial bank, grade B","bankTier2":"Bank Tier-2 / other capital instruments held","corpIG":"Investment-grade corporate","corpGeneral":"General corporate","corpSub":"Subordinated debt of corporates"},"rwRef":{"cgb":"Capital Rules (2023), Annex 2","pbc":"Capital Rules (2023), Annex 2","policyBank":"Capital Rules (2023), Annex 2","localGeneral":"Capital Rules (2023), Annex 2","localSpecial":"Capital Rules (2023), Annex 2","bankA":"Capital Rules (2023), Annex 2","bankB":"Capital Rules (2023), Annex 2","bankTier2":"Capital Rules (2023), Annex 2","corpIG":"Capital Rules (2023), Annex 2","corpGeneral":"Capital Rules (2023), Annex 2","corpSub":"Capital Rules (2023), Annex 2"},"rwNote":"Illustrative weights under the NFRA Capital Rules for Commercial Banks (effective 1 Jan 2024). Article and paragraph numbers must be checked against the official text; conditions (maturity, grading, eligibility) are omitted.","approachTitle":"IRB vs weighted approach","approach":"Approach","weighted":"Weighted (standardised)","irb":"Internal ratings-based (IRB)","rwClass":"Exposure class","pd":"PD","lgd":"LGD","maturity":"Effective maturity M","ratio":"Capital ratio applied","measure":"Measure","value":"Value","ead":"Exposure (EAD)","rwa":"Risk-weighted assets","capitalReq":"Capital at {r}","weightedFormula":"RWA = EAD × risk weight\nCapital = RWA × ratio","irbFormula":"K = LGD × [N((G(PD) + √R·G(0.999)) / √(1 − R)) − PD] × (1 + (M − 2.5)·b) / (1 − 1.5·b)\nR = 0.12·w + 0.24·(1 − w), w = (1 − e^(−50·PD)) / (1 − e^(−50))\nb = (0.11852 − 0.05478·ln PD)²;  RW = 12.5 × K","irbNote":"Basel corporate IRB formula without SME adjustment, floors or scaling — illustrative. Under IRB the April 2026 PD increase raises capital; under the weighted approach the weight does not move with the issuer’s deterioration.","ociTitle":"OCI into CET1 (April 2026)","ociText":"Accumulated OCI is part of CET1. Under FVOCI, the fair-value loss reaches capital before any sale; under amortised cost only the ECL does.","cet1Effect":"CET1 effect (before tax)","ofWhichOci":"of which OCI","ociCaption":"Cumulative equity effect by lens, RMB m","ociFormula":"CET1 effect = P&L effect (retained earnings) + accumulated OCI","ociNote":"Before tax, before any regulatory adjustments; illustrative.","gsibTitle":"Static facts: G-SIB and TLAC","gsibFacts":["G-SIB bucket 3 applies from 1 January 2027 (higher loss-absorbency requirement per the FSB list; verify the current list).","TLAC: minimum 16% of RWA from 1 January 2025, rising to 18% from 1 January 2028; leverage-ratio TLAC 6% then 6.75%.","Bank Tier-2 and TLAC-eligible holdings of other banks attract high risk weights and deductions — relevant for the Tier-2 line in the portfolio."],"gsibNote":"Static regulatory facts for context only; verify against primary sources.","notTitle":"What capital does not do","nots":["Capital does not prevent losses — it absorbs them after they occur.","A 0% risk weight does not mean zero risk: government bonds still lose value when rates rise, and liquidity can still disappear.","A capital charge is not a limit and not a price: it does not replace credit judgement, concentration limits or the decision to hold or sell."],"qTitle":"Discussion","q":"Under the weighted approach, Huaxing’s risk weight did not change between 2025 and June 2026. Does that mean capital pressure did not change?","a":["No. Capital fell through the ECL charge (retained earnings) and, under FVOCI, through OCI in CET1.","Under IRB the higher PD would also raise RWA. And a realised loss on sale reduces capital immediately."]},"controls":{"stepsTitle":"Four steps mapped to the case dates","steps":{"monitoring":{"name":"1 · Monitoring","text":"Spread and bid–ask move (Sep 2025) and monthly sales fall far faster than the sector (Dec 2025). Monitoring must see issuer-specific evidence, not only payments."},"escalation":{"name":"2 · Escalation","text":"CFO resignation (Feb 2026), trust-loan extensions and spread 450 bp (Mar 2026): escalate to the credit committee with a dated agenda."},"impairment":{"name":"3 · Formal impairment assessment","text":"FY2025 results (Apr 2026): SICR assessment, Stage 2, lifetime ECL, five-category review, documented."},"execution":{"name":"4 · Execution","text":"Rating terminated and maturity wall (Jun 2026): decide — hold, reduce, hedge or exit — with owner, triggers and counterfactual response (Jul 2026)."}},"dates":{"sep25":"Sep 2025","dec25":"Dec 2025","feb26":"Feb 2026","mar26":"Mar 2026","apr26":"Apr 2026","jun26":"Jun 2026","jul26":"Jul 2026"},"ruleTitle":"Illustrative escalation rule","notPolicy":"Illustrative only — neither ICBC policy nor regulation","ruleText":"Escalate to the credit committee within five working days when at least the chosen number of signals is present at a date. Edit the thresholds and see when the rule would have fired.","rule":{"spreadLevel":"Spread level ≥","spreadWidening":"Widening since purchase ≥","priceFloor":"Clean price below","cashCover":"Cash / short-term debt below","minHits":"Signals required"},"date":"Date","cols":{"spreadLevel":"Spread level","widening":"Widening","price":"Clean price","cover":"Cash cover","event":"Qualitative red flag","hits":"Signals"},"na":"n/a","escalate":"escalate","firstTrigger":"With these thresholds the rule first fires in {date}.","noTrigger":"With these thresholds the rule never fires on the case dates.","ruleFormula":"Signals = count of {spread ≥ level, spread − 210 ≥ widening, clean price \u003c floor, cash cover \u003c threshold, qualitative red flag}\nEscalate when signals ≥ required","ruleNote":"Dec 2025 has no market observation in the case; red flags: sales (Dec 2025), CFO and trust loans (Mar 2026), FY2025 results (Apr 2026), rating termination (Jun 2026).","lensesTitle":"Four functional lenses","function":"Function","responsibility":"Responsibility","inCase":"In the Huaxing case","lenses":{"investment":{"name":"Investment (front office)","role":"Owns the position and the hold/sell decision; proposes actions with economics.","case":"Prepares the Jun 2026 decision: proceeds vs hold value, break-even probability, hedge feasibility."},"risk":{"name":"Risk management","role":"Independent assessment, limits, internal grade, SICR and ECL inputs; challenges the front office.","case":"Refreshes the internal grade after the rating termination; runs the escalation rule; sets ECL scenarios."},"audit":{"name":"Internal audit","role":"Tests whether controls operated on time and were documented.","case":"Checks that escalation happened when the rule fired and that the stage judgement is evidenced."},"operations":{"name":"Operations / finance","role":"Valuation, accounting entries, regulatory reporting, settlement.","case":"Books ECL, OCI and any modification loss; reports the five-category result; executes any sale at the bid."}},"qTitle":"Discussion","q":"Which control failure turns a loss while paying into a larger loss?","a":["Waiting for a missed payment. Every signal in the case arrived while coupons were paid; a control keyed to payment status would escalate only after the exit price has collapsed.","Controls should be dated, evidence-based and owned — with a named escalation route."],"legend":"● signal present · ○ not present"},"decision":{"ladderTitle":"Value ladder (per 100 nominal)","l":{"acGross":"Amortised cost (gross, dirty)","acNet":"Amortised cost net of allowance","mid":"Mid (fair value)","bid":"Executable bid (sale proceeds)","holdA":"Hold → A (Jul 2026)","holdB":"Hold → B (Jul 2026)","expected":"Expected hold (P(A) {p}, net of costs)","expectedShort":"Expected hold value","legendAC":"Amortised cost","legendHold":"Hold outcomes","bidMarker":"sale proceeds"},"ladderNote":"Jun 2026 values at 1.75 years; counterfactual values in Jul 2026 at 1.667 years, as in the class deck. Bars start at 85 to show differences.","probTitle":"Proceeds vs probability-weighted holding value","pA":"Probability of counterfactual A (support)","capitalCost":"Cost of capital while holding","liquidityCost":"Liquidity cost while holding","measure":"Measure","value":"Value","saleProceeds":"Sale proceeds now (executable bid)","holdA":"Value if A","holdB":"Value if B","costs":"Capital and liquidity costs","expectedHold":"Expected holding value","breakEvenP":"Break-even probability of A","breakEven":"break-even","beAria":"Break-even probability {p}; current probability {cur}","readHold":"On these inputs holding is worth more than selling: the probability of A exceeds the break-even of {p}.","readSell":"On these inputs selling is worth more than holding: the probability of A is below the break-even of {p}.","probNote":"Before capital and liquidity costs the break-even is about 8%. Add the costs of holding a Stage 2 exposure and funding it, and the bar rises. Liquidity needs and limits may force a sale whatever the probabilities say.","beFormula":"Hold value = p·V_A + (1 − p)·V_B − capital cost − liquidity cost\nBreak-even p* = (sale proceeds + costs − V_B) ÷ (V_A − V_B)","extTitle":"Extension branch: PV cost vs modification loss","extIntro":"If B happens, part of the principal is paid late. Compare the economic cost (at the market rate) with the accounting modification loss (at the original EIR).","ext":{"paidShare":"Share of principal paid at maturity","delay":"Delay of the rest","coupon":"Coupon on the delayed part","rate":"Market discount rate","eir":"Original EIR","delayed":"Delayed principal","pvMarket":"PV of delayed cash flows at market rate","pvCost":"Economic PV cost","pvEir":"PV of delayed cash flows at original EIR","modLoss":"Modification loss (P&L)","read":"With the coupon equal to the EIR, the accounting modification loss is nil although the economic cost is not: the loss shows up in fair value, ECL and classification (restructured asset) instead.","formula":"PV cost = delayed principal − Σ CFₖ / (1 + market rate)^k\nModification loss = delayed principal − Σ CFₖ / (1 + EIR)^k\n(values at the original payment date)","note":"Cash flows listed per RMB 100 m nominal."},"hedgeTitle":"Hedge feasibility","hedge":["Rates: an interest-rate swap or CGB futures can hedge the benchmark part — the control — but not the credit.","Credit: single-name credit protection on an onshore developer (e.g. credit risk mitigation warrants) is thin and expensive when needed; a sector proxy leaves basis risk.","In June 2026 a hedge is mostly a way to buy time, not to remove the Huaxing credit risk. Selling is the only complete hedge."],"formTitle":"Decision record","formIntro":"Write the decision as you would for the credit committee. The form checks completeness; print it or export JSON.","f":{"action":"Decision","sellShare":"Share to sell (if reduce)","sellShareHint":"Only used for “reduce”.","rationale":"Rationale (at least 30 characters)","rationalePh":"Economics, liquidity needs, constraints, evidence…","owner":"Named owner","ownerPh":"Name and function","triggers":"Dated triggers","triggersHelp":"Each trigger needs a number, a date and a consequence.","metric":"Metric","op":"Condition","number":"Number","date":"By date","consequence":"Consequence","consequencePh":"e.g. sell the remaining position within 5 days","remove":"Remove","add":"Add trigger","escalation":"Escalation route","escalationPh":"Who is informed, who decides, by when","responseA":"Response if counterfactual A (support)","responseAPh":"What you do if the guarantee and loan arrive","responseB":"Response if counterfactual B (extension)","responseBPh":"What you do if the extension is proposed"},"actions":{"hold":"Hold","reduce":"Reduce","hedge":"Hedge","exit":"Exit"},"metrics":{"spread":"Spread (bp)","price":"Price (per 100)","cashCover":"Cash / short-term debt","event":"Event: extension proposal","date":"Date reached"},"complete":"Complete — ready for committee.","incomplete":"Incomplete — see the checklist.","v":{"action":"Decision chosen","sellShare":"Share to sell between 0 and 100%","rationale":"Rationale of at least 30 characters","owner":"Named owner","trigger":"At least one trigger with number, date and consequence","escalation":"Escalation route","responseA":"Response to counterfactual A","responseB":"Response to counterfactual B"},"print":"Print / save as PDF","exportJson":"Export JSON","importJson":"Import JSON","replayTitle":"Replay the decision","replay":"Replay against","replayNone":"Not yet","replayHelp":"Replay your recorded decision against counterfactual A or B to see the outcome and which triggers fire.","replayNeedsAction":"Choose a decision first.","r":{"scenario":"Scenario","sold":"Share sold in Jun 2026","outcome":"Outcome value (RMB m)","vsSellAll":"vs selling everything in Jun 2026","vsHoldAll":"vs holding everything","triggers":"Triggers that fire","noTriggers":"None of your triggers fires in this scenario — is that intended?","response":"Your recorded response","noResponse":"(no response recorded)","lessonA":"In A, selling in June realised the worst price. A good decision can still look wrong afterwards — judge it by the information and the process at the time.","lessonB":"In B, holding costs more than the June sale, and the extension adds a PV cost with no accounting modification loss. Did your triggers get you out early enough?"},"toAnswer":"Go to the answer →","printEcon":"Sale proceeds {sale}; value if A {a}; value if B {b}; P(A) {p}; expected hold value {hold}; break-even probability {be}."},"answer":{"shortTitle":"Short answer","short":["A bond can lose money while the issuer keeps paying because its value, its accounting and its capital all depend on expected future cash flows and on the price at which it can be sold — not only on payments already received.","In the Huaxing case every coupon was paid; the position still lost value in five distinct ways."],"fiveTitle":"Five statements","computedIn":"Computed in:","s1":{"title":"Falling economic value","text":"Benchmark and spread moves cut the price while coupons were paid: {mar} of price by Mar 2026 and an economic change of {jun} by Jun 2026. The benchmark part is rates, not credit."},"s2":{"title":"Weaker expected cash flows","text":"Sales, cash cover, operating cash flow and the maturity wall lowered the expected cash flows: under B the value falls to {b}, under A it recovers to {a} — before any missed payment."},"s3":{"title":"Impairment charges","text":"Significant increase in credit risk moved the bond to Stage 2: an ECL charge of {ecl} through P&L, and under FVOCI a total equity effect of {oci}."},"s4":{"title":"Constrained exit liquidity","text":"Bid–ask widened from 5 to 100 bp: in Jun 2026 the exit discount alone is {bid}, and the loss realised on sale would be {realised}."},"s5":{"title":"Greater capital pressure","text":"ECL and OCI reduce CET1; under IRB the higher PD raises risk-weighted assets; a realised loss reduces capital at once — all while the issuer pays."},"notTitle":"What the answer is not","nots":["Not “the bond has not lost money because it has not defaulted”.","Not “all losses are credit losses” — benchmark rates are the control.","Not “the accounting lens changes the economics” — it changes where and when the loss is shown.","Not “a rating tells us when to act” — evidence and dated triggers do."],"zkbTitle":"Questions for the ZKB visit","zkbIntro":"Take these to the afternoon visit and compare the answers with the Huaxing case.","zkb":["How do you separate rate risk from credit risk in the bond book — and who owns each?","Which signals, other than payment status, put a bond on your watchlist? How are they dated and documented?","How do you decide a significant increase in credit risk for bonds — and how much weight do market spreads carry?","How do you measure exit liquidity: at mid, at bid, or with a position-size adjustment?","When has a hold-or-sell decision been made against the model — and how was it documented?","How do you treat keepwell, guarantee and other support structures in limits and in LGD?"]},"glossary":{"search":"Search","searchPh":"Type a term in English or Chinese…","count":"{n} of {total} terms","termsTitle":"Glossary (Appendix A7)","acrTitle":"Acronyms (Appendix A9)","colTerm":"Term","colOther":"Other language","colDef":"Definition","source":"Compiled for this class from the terminology of the class materials; verify official translations of regulatory terms in the source texts.","items":{"pd":{"term":"Probability of default (PD)","def":"Probability that the obligor defaults within a horizon (12 months or lifetime)."},"lgd":{"term":"Loss given default (LGD)","def":"Share of the exposure lost if default occurs, after recoveries."},"ead":{"term":"Exposure at default (EAD)","def":"Amount exposed at the time of default."},"ecl":{"term":"Expected credit loss (ECL)","def":"Probability-weighted estimate of credit losses; PD × LGD × EAD in its simplest form."},"sicr":{"term":"Significant increase in credit risk (SICR)","def":"The IFRS 9 test that moves an asset from Stage 1 to Stage 2 and lifetime ECL."},"stage":{"term":"Stages 1 / 2 / 3","def":"IFRS 9 impairment stages: 12-month ECL, lifetime ECL, credit-impaired."},"ac":{"term":"Amortised cost","def":"Measurement at the effective interest rate less the loss allowance."},"fvoci":{"term":"Fair value through other comprehensive income (FVOCI)","def":"Fair value on the balance sheet; fair-value changes in OCI; ECL in P&L."},"fvtpl":{"term":"Fair value through profit or loss (FVTPL)","def":"Fair-value changes in P&L; outside the impairment scope."},"eir":{"term":"Effective interest rate (EIR)","def":"Rate that discounts expected cash flows to the initial carrying amount."},"sppi":{"term":"SPPI test","def":"Test whether contractual cash flows are solely payments of principal and interest."},"businessModel":{"term":"Business model","def":"How a portfolio is managed: hold to collect, hold to collect and sell, or other."},"poci":{"term":"Purchased or originated credit-impaired (POCI)","def":"An asset credit-impaired at purchase; credit-adjusted EIR and no Day-1 allowance."},"modification":{"term":"Modification gain or loss","def":"Change in the gross carrying amount when contractual cash flows are renegotiated, discounted at the original EIR."},"fiveCat":{"term":"Five-category classification","def":"China’s risk classification of financial assets: normal, special mention, substandard, doubtful, loss."},"specialMention":{"term":"Special mention","def":"Five-category grade for assets with factors that may adversely affect repayment."},"npl":{"term":"Non-performing asset","def":"Assets classified substandard, doubtful or loss."},"restructured":{"term":"Restructured asset","def":"An asset whose terms were changed because the debtor is in financial difficulty; subject to an observation period."},"spread":{"term":"Credit spread","def":"Yield above the benchmark government bond of the same currency and maturity."},"spreadDuration":{"term":"Spread duration","def":"Price sensitivity to a change in spread; close to modified duration for a fixed-rate bond."},"modDuration":{"term":"Modified duration","def":"Macaulay duration ÷ (1 + y): percentage price change for a small yield change."},"convexity":{"term":"Convexity","def":"Curvature of price in yield; makes the duration approximation overstate losses for large shocks."},"bidAsk":{"term":"Bid–ask spread","def":"Difference between the price at which dealers buy and sell; widens as credit and liquidity deteriorate."},"executable":{"term":"Executable price","def":"The price at which a trade can actually be done now, for this size."},"economicValue":{"term":"Economic value","def":"Present value of expected cash flows at current market yields."},"realisedLoss":{"term":"Realised loss","def":"A loss crystallised by a sale or settlement."},"refinancing":{"term":"Refinancing risk","def":"Risk that maturing debt cannot be repaid with new funding on acceptable terms."},"distressed":{"term":"Distressed restructuring / extension","def":"Changing payment terms because the debtor is in financial difficulty, e.g. paying 40% and delaying 60%."},"keepwell":{"term":"Keepwell deed","def":"An undertaking by a parent to keep an SPV solvent and liquid; not a guarantee of payment."},"guarantee":{"term":"Guarantee","def":"A direct, enforceable promise by the guarantor to pay if the obligor does not."},"spv":{"term":"Special purpose vehicle (SPV)","def":"A separate entity, often offshore, that issues debt; it is a different obligor from the parent."},"noncall":{"term":"Non-call","def":"The issuer does not exercise a call option; the bond continues. Not a default."},"pwd":{"term":"Write-down at the point of non-viability","def":"Contractual reduction of a capital instrument’s principal when the issuing bank is non-viable."},"tier2":{"term":"Tier-2 capital","def":"Subordinated bank capital that absorbs losses in resolution."},"cet1":{"term":"Common equity Tier 1 (CET1)","def":"Highest-quality bank capital; includes retained earnings and accumulated OCI."},"rwa":{"term":"Risk-weighted assets (RWA)","def":"Exposures weighted by risk; the denominator of capital ratios."},"irb":{"term":"Internal ratings-based approach (IRB)","def":"Capital approach using the bank’s own PD (and possibly LGD) estimates."},"weightedApproach":{"term":"Weighted approach","def":"The standardised approach to credit risk with prescribed risk weights."},"tlac":{"term":"Total loss-absorbing capacity (TLAC)","def":"Capital and eligible debt that G-SIBs must hold for resolution."},"gsib":{"term":"Global systemically important bank (G-SIB)","def":"Bank designated by the FSB; subject to higher loss-absorbency requirements by bucket."},"lgfv":{"term":"Local government financing vehicle (LGFV)","def":"An entity that finances local infrastructure; support from the government is not a legal guarantee."},"nationalScale":{"term":"National-scale rating","def":"A rating that ranks credit risk within one country."},"breakEvenPD":{"term":"Break-even PD","def":"Spread ÷ LGD: the annual default rate at which spread income just covers losses (simplified)."},"riskNeutral":{"term":"Risk-neutral PD","def":"Default probability implied by market prices; includes a risk premium."},"carry":{"term":"Carry","def":"Yield of the asset less the cost of funding it."},"fundedReturn":{"term":"Funded return","def":"Total return after deducting the funding cost of the position."},"watchlist":{"term":"Watchlist","def":"Internal list of exposures under enhanced monitoring."},"escalation":{"term":"Escalation","def":"Formal referral of an issue to a higher decision body with a dated agenda."}},"acronyms":{"AC":"Amortised cost","AT1":"Additional Tier 1 capital","bp":"Basis point (0.01%)","CAS_22":"Chinese Accounting Standard 22 — recognition and measurement of financial instruments","CET1":"Common equity Tier 1","CFO":"Chief financial officer","CGB":"China Government Bond","CRMW":"Credit risk mitigation warrant","DCF":"Discounted cash flow","EAD":"Exposure at default","EBITDA":"Earnings before interest, taxes, depreciation and amortisation","ECL":"Expected credit loss","EIR":"Effective interest rate","FSB":"Financial Stability Board","FVOCI":"Fair value through other comprehensive income","FVTPL":"Fair value through profit or loss","FY":"Financial year","G_SIB":"Global systemically important bank","IFRS_9":"International Financial Reporting Standard 9 — Financial Instruments","IRB":"Internal ratings-based approach","LGD":"Loss given default","LGFV":"Local government financing vehicle","MTN":"Medium-term note","NC":"Non-call (e.g. 10NC5)","NFRA":"National Financial Regulatory Administration","OCI":"Other comprehensive income","P&L":"Profit and loss","PD":"Probability of default","POCI":"Purchased or originated credit-impaired","RWA":"Risk-weighted assets","SICR":"Significant increase in credit risk","SOE":"State-owned enterprise","SPPI":"Solely payments of principal and interest","SPV":"Special purpose vehicle","TLAC":"Total loss-absorbing capacity","UST":"US Treasury","ZKB":"Zürcher Kantonalbank"}},"tie":{"t0price":"T0 price, 3 years at 3.60%","t0mac":"T0 Macaulay duration (years)","t0mod":"T0 modified duration","sh120a":"Spread +120 bp — approximation (RMB m)","sh120d":"Spread +120 bp — DCF (RMB m)","sh50a":"Spread +50 bp — approximation (RMB m)","sh50d":"Spread +50 bp — DCF (RMB m)","sh30a":"Benchmark +30 bp — approximation (RMB m)","sh30d":"Benchmark +30 bp — DCF (RMB m)","m26b":"Mar 2026 price at 3.90%","m26p":"Mar 2026 price at 6.30%","m26be":"Mar 2026 benchmark effect (RMB m)","m26se":"Mar 2026 spread effect (RMB m)","m26te":"Mar 2026 total price effect (RMB m)","m26c":"Mar 2026 coupon received (RMB m)","m26g":"Mar 2026 gross total return (RMB m)","m26f":"Mar 2026 funded return (RMB m)","m26bid":"Mar 2026 executable bid at +40 bp","a26ac":"Apr 2026 dirty value at 3.60% (RMB m)","a26acc":"Apr 2026 accrued interest (RMB m)","a26mid":"Apr 2026 mid 本要求；在权重法下，风险权重不随发行人信用恶化而变化。","ociTitle":"其他综合收益计入核心一级资本（2026年4月）","ociText":"累计其他综合收益是核心一级资本的组成部分。在FVOCI下，公允价值损失在出售前即影响资本；在摊余成本下，只有预期信用损失会影响资本。","cet1Effect":"对核心一级资本的影响（税前）","ofWhichOci":"其中：其他综合收益","ociCaption":"各会计视角下对权益的累计影响","ociFormula":"对核心一级资本的影响 = 当期损益影响（留存收益） + 累计其他综合收益","ociNote":"税前，未考虑任何监管调整；仅为示意。","gsibTitle":"静态事实：全球系统重要性银行与总损失吸收能力","gsibFacts":["自2027年1月1日起适用全球系统重要性银行第3组（根据金融稳定理事会名单适用更高的附加损失吸收能力要求；请核实最新名单）。","总损失吸收能力：自2025年1月1日起最低为风险加权资产的16%，自2028年1月1日起提高至18%；杠杆率口径的总损失吸收能力要求为6%，其后为6.75%。","持有其他银行的二级资本债和合格总损失吸收能力工具，适用较高的风险权重和扣除规定——这与组合中的二级资本债持仓相关。"],"gsibNote":"静态监管事实，仅供参考；请以原始资料核实。","notTitle":"资本不能做什么","nots":["资本不能防止损失——它只在损失发生后吸收损失。","0%的风险权重并不意味着零风险：利率上升时国债同样会贬值，流动性也可能消失。","资本要求既不是限额也不是价格：它不能替代信用判断、集中度限额，也不能替代持有或出售的决策。"],"qTitle":"讨论","q":"在权重法下，华兴的风险权重在2025年至2026年6月之间没有变化。这是否意味着资本压力没有变化？","a":["不是。资本通过预期信用损失计提（留存收益）减少；在FVOCI下，还通过核心一级资本中的其他综合收益减少。","在内部评级法下，违约概率上升还会增加风险加权资产。而出售时的已实现损失会立即减少资本。"]},"controls":{"stepsTitle":"与案例日期对应的四个步骤","steps":{"monitoring":{"name":"1 · 监测","text":"利差和买卖价差变动（2025年9月），月度销售下滑远快于行业（2025年12月）。监测必须捕捉发行人特有的证据，而不仅是付款情况。"},"escalation":{"name":"2 · 升级报告","text":"首席财务官辞职（2026年2月）、信托贷款展期和利差450个基点（2026年3月）：带着有日期的议程升级报告至信贷委员会。"},"impairment":{"name":"3 · 正式减值评估","text":"2025财年业绩（2026年4月）：信用风险显著增加评估、第2阶段、整个存续期预期信用损失、五级分类复核，并形成书面记录。"},"execution":{"name":"4 · 执行","text":"评级终止和集中到期（2026年6月）：作出决策——持有、减持、套期保值或退出——明确责任人、触发条件以及对反事实情景的应对（2026年7月）。"}},"dates":{"sep25":"2025年9月","dec25":"2025年12月","feb26":"2026年2月","mar26":"2026年3月","apr26":"2026年4月","jun26":"2026年6月","jul26":"2026年7月"},"ruleTitle":"示意性升级报告规则","notPolicy":"仅为示意——既非中国工商银行政策，也非监管规定","ruleText":"当某一日期出现的信号数量达到所选阈值时，须在五个工作日内升级报告至信贷委员会。可编辑各阈值，查看该规则会在何时触发。","rule":{"spreadLevel":"利差水平 ≥","spreadWidening":"自买入以来扩大幅度 ≥","priceFloor":"净价低于","cashCover":"现金 / 短期债务低于","minHits":"所需信号数"},"date":"日期","cols":{"spreadLevel":"利差水平","widening":"扩大幅度","price":"净价","cover":"现金覆盖率","event":"定性预警信号","hits":"信号数"},"na":"不适用","escalate":"升级报告","firstTrigger":"按这些阈值，规则首次触发于 {date}。","noTrigge :"若发生情景B，部分本金将延迟偿付。比较经济成本（按市场利率）与会计上的修改损失（按原实际利率）。","ext":{"paidShare":"到期偿付的本金比例","delay":"其余部分的延迟期限","coupon":"延迟部分的票面利率","rate":"市场折现率","eir":"原实际利率","delayed":"延迟本金","pvMarket":"按市场利率计算的延迟现金流现值","pvCost":"经济现值成本","pvEir":"按原实际利率计算的延迟现金流现值","modLoss":"修改损失（当期损益）","read":"当票面利率等于实际利率时，会计上的修改损失为零，但经济成本并不为零：损失转而体现在公允价值、预期信用损失和分类（重组资产）中。","formula":"现值成本 = 延迟本金 − Σ CFₖ / (1 + 市场利率)^k\n修改损失 = 延迟本金 − Σ CFₖ / (1 + EIR)^k\n（以原付款日为估值时点）","note":"现金流按每1亿元面值列示。"},"hedgeTitle":"套期保值可行性","hedge":["利率：利率互换或国债期货可以对冲基准利率部分——即对照项——但无法对冲信用风险。","信用：针对境内房地产开发商的单一名称信用保护（如信用风险缓释凭证）在需要时往往供给稀少且价格昂贵；使用行业替代工具则会留下基差风险。","在2026年6月，套期保值主要是争取时间的手段，而不能消除华兴的信用风险。出售是唯一完全的对冲。"],"formTitle":"决策记录","formIntro":"按提交信贷委员会的标准写出决策。表单会检查完整性；可打印或导出为JSON。","f":{"action":"决策","sellShare":"出售比例（如选择减持）","sellShareHint":"仅在选择“减持”时使用。","rationale":"理由（至少30个字符）","rationalePh":"经济测算、流动性需求、约束条件、证据……","owner":"指定责任人","ownerPh":"姓名及职能","triggers":"带日期的触发条件","triggersHelp":"每个触发条件都需要一个数值、一个日期和一个后续行动。","metric":"指标","op":"条件","number":"数值","date":"截止日期","consequence":"后续行动","consequencePh":"例如：在5天内出售剩余头寸","remove":"删除","add":"添加触发条件","escalation":"升级路径","escalationPh":"通知谁、由谁决策、何时决策","responseA":"反事实情景A（获得支持）下的应对","responseAPh":"若担保和借款到位，您将如何应对","responseB":"反事实情景B（展期）下的应对","responseBPh":"若发行人提出展期，您将如何应对"},"actions":{"hold":"持有","reduce":"减持","hedge":"套期保值","exit":"退出"},"metrics":{"spread":"利差（基点）","price":"价格（每100元面值）","cashCover":"现金 / 短期债务","event":"事件：提出展期","date":"到达日期"},"complete":"已完成——可提交委员会。","incomplete":"尚未完成——请查看清单。","v":{"action":"已选择决策","sellShare":"出售比例在0至100%之间","rationale":"理由至少30个字符","owner":"已指定责任人","trigger":"至少一个包含数值、日期和后续行动的触发条件","escalation":"升级路径","responseA":"对反事实情景A的应对","responseB":"对反事实情景B的应对"},"print":"打印 / 另存为PDF","exportJson":"导出JSON","importJson":"导入JSON","replayTitle":"回放决策","replay":"回放情景","replayNone":"暂不回放","replayHelp":"将已记录的决策分别在反事实情景A或B下回放，查看结果以及哪些触发条件被触发。","replayNeedsAction":"请先选择一项决策。","r":{"scenario":"情景","sold":"2026年6月出售比例","outcome":"结果价值","vsSellAll":"相对于2026年6月全部出售","vsHoldAll":"相对于全部持有","triggers":"被触发的条件","noTriggers":"在该情景下您的触发条件均未触发——这是您的本意吗？","response":"您记录的应对措施","noResponse":"（未记录应对措施）","lessonA":"在情景A下，6月出售实现的是最差价格。一个好的决策事后仍可能显得错误——应根据当时掌握的信息和决策流程来评判。","lessonB":"在情景B下，持有的成本高于6月出售，且展期带来了现值成本，而没有会计上的修改损失。您的触发条件是否让您足够早地退出？"},"toAnswer":"前往答案 →","printEcon":"出售所得 {sale}；情景A下的价值 {a}；情景B下的价值 {b}；P(A) {p}；预期持有价值 {hold}；盈亏平衡概率 {be}。"},"answer":{"shortTitle":"简要回答","short":["即使发行人持续付息，债券仍可能亏损，因为其价值、会计计量和资本都取决于预期未来现金流以及可出售的价格——而不仅仅取决于已收到的付款。","在华兴案例中，每期票息都已支付；但该头寸仍以五种不同方式损失了价值。"],"fiveTitle":"五个结论","computedIn":"计算页面：","s1":{"title":"经济价值下降","text":"在票息照付的同时，基准利率和利差变动压低了价格：截至2026年3月价格损失 {mar}，截至2026年6月经济价值变动 {jun}。其中基准利率部分属于利率风险，而非信用风险。"},"s2":{"title":"预期现金流减弱","text":"销售、现金覆盖率、经营活动现金流和集中到期降低了预期现金流：在情景B下价值降至 {b}，在情景A下回升至 {a}——均发生在任何付款违约之前。"},"s3":{"title":"减值计提","text":"信用风险显著增加使债券转入第2阶段：通过当期损益计提预期信用损失 {ecl}；在FVOCI下对权益的总影响为 {oci}。"},"s4":{"title":"退出流动性受限","text":"买卖价差从5个基点扩大至100个基点：2026年6月仅退出折价就达 {bid}，出售时的已实现损失将为 {realised}。"},"s5":{"title":"资本压力加大","text":"预期信用损失和其他综合收益减少核心一级资本；在内部评级法下，违约概率上升会增加风险加权资产；已实现损失会立即减少资本——而这一切都发生在发行人持续付息期间。"},"notTitle":"答案不是什么","nots":["不是“债券没有违约，所以没有亏损”。","不是“所有损失都是信用损失”——基准利率是对照项。","不是“会计视角改变了经济实质”——它改变的是损失在何处、何时体现。","不是“评级会告诉我们何时行动”——证据和带日期的触发条件才会。"],"zkbTitle":"苏黎世州银行参访问题","zkbIntro":"请带着这些问题参加下午的参访，并将对方的回答与华兴案例进行比较。","zkb":["在债券账簿中，您如何区分利率风险和信用风险？分别由谁负责？","除付款状态外，哪些信号会让一只债券被列入关注名单？这些信号如何标注日期和记录？","对于债券，您如何判断信用风险是否显著增加？市场利差占多大权重？","您如何衡量退出流动性：按中间价、按买入报价，还是结合头寸规模进行调整？","是否曾有持有或出售的决策与模型结论相悖？当时是如何记录的？","在限额和违约损失率中，您如何处理维好协议、担保及其他支持结构？"]},"glossary":{"search":"搜索","searchPh":"输入中文或英文术语……","count":"{n} / {total} 个术语","termsTitle":"术语表（附录A7）","acrTitle":"缩略语（附录A9）","colTerm":"术语","colOther":"另一语言","colDef":"定义","source":"根据课程材料中的术语为本课程编制；监管术语的官方译法请以原始文本核实。","items":{"pd":{"term":"违约概率（PD）","def":"债务人在一定期限内（12个月或整个存续期）发生违约的概率。"},"lgd":{"term":"违约损失率（LGD）","def":"发生违约时，扣除回收后损失的风险暴露比例。"},"ead":{"term":"违约风险暴露（EAD）","def":"违约发生时的风险暴露金额。"},"ecl":{"term":"预期信用损失（ECL）","def":"以概率加权的信用损失估计；最简形式为 违约概率 × 违约损失率 ×
